<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;background:#000}
#menu{width:2500px;height:843px;display:flex;font-family:'Noto Sans JP',sans-serif;color:#fff;position:relative;overflow:hidden;background:#0b0b0d}
.cell{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;border-right:3px solid #2a2a30;overflow:hidden}
.cell:last-child{border-right:none}
.c1{background:radial-gradient(circle at 30% 20%,#3a0d12 0%,#141014 60%,#0b0b0d 100%)}
.c2{background:radial-gradient(circle at 70% 30%,#3a0d12 0%,#151116 55%,#0b0b0d 100%)}
.c3{background:linear-gradient(160deg,#141418 0%,#0b0b0d 100%)}
.ribbon{position:absolute;left:-120px;top:70px;width:520px;transform:rotate(-38deg);background:#d7192a;color:#fff;text-align:center;font-size:58px;font-weight:900;letter-spacing:6px;padding:10px 0}
.icon{width:200px;height:200px;border-radius:50%;border:8px solid #fff;display:flex;align-items:center;justify-content:center;margin-bottom:34px}
.icon.red{border-color:#d7192a}
.en{font-family:'Oswald',sans-serif;font-size:40px;letter-spacing:8px;color:#d7192a;font-weight:600}
.en.gray{color:#9a9aa6}
.ttl{font-size:96px;font-weight:900;margin-top:12px;letter-spacing:2px;line-height:1.15;text-align:center}
.sub{font-size:44px;font-weight:700;color:#d8d8e0;margin-top:14px;text-align:center}
.btn{margin-top:40px;border-radius:999px;padding:18px 70px;font-size:52px;font-weight:900;border:5px solid #fff}
.btn.red{background:#d7192a;border-color:#d7192a}
.date{display:inline-block;background:#fff;color:#0b0b0d;border-radius:14px;padding:6px 26px;font-size:48px;font-weight:900;margin-top:16px}
.foot{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-family:'Oswald',sans-serif;font-size:26px;letter-spacing:10px;color:#d7192a}
</style></head><body><div id="menu">
<div class="cell c1"><div class="ribbon">無料</div>
  <div class="icon red"><svg width="110" height="110" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="14" height="14" rx="2"/><path d="M16 10l6-3v10l-6-3z" fill="#fff"/></svg></div>
  <div class="en">ONLINE SEMINAR</div>
  <div class="ttl">無料セミナー</div>
  <div class="date">11/8・13・15</div>
  <div class="btn red">申し込む →</div>
</div>
<div class="cell c2">
  <div class="icon"><svg width="120" height="120" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg></div>
  <div class="en gray">PROFILE</div>
  <div class="ttl">鈴木コーチ</div>
  <div class="sub">JLINEパーソナルコーチについて</div>
  <div class="btn">詳しく見る →</div>
</div>
<div class="cell c3">
  <div class="icon" style="border-radius:16px"><svg width="110" height="110" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M5 7h14M5 12h14M5 17h9"/></svg></div>
  <div class="en gray">WORKSHEET</div>
  <div class="ttl">振り返りシート</div>
  <div class="sub">無料でダウンロード</div>
  <div class="btn">受け取る →</div>
</div>
<div class="foot">JLINE ｜ パーソナルコーチ</div>
</div></body></html>
