<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;background:#fff}
body{width:1040px;font-family:'Noto Sans JP',sans-serif;color:#0b1f3a}
#card{width:1040px;padding:0 0 40px;background:#fff}
.top{background:#0b1f3a;color:#fff;text-align:center;padding:34px 20px 30px}
.top .t{font-size:56px;font-weight:900}
.top .s{font-size:30px;font-weight:700;color:#ffd400;margin-top:6px}
.step{display:flex;align-items:flex-start;margin:34px 44px 0;background:#f3f6fa;border-radius:24px;padding:30px 30px}
.num{flex:0 0 96px;height:96px;border-radius:50%;background:#2d8cff;color:#fff;font-size:56px;font-weight:900;display:flex;align-items:center;justify-content:center;margin-right:28px}
.body .h{font-size:42px;font-weight:900;line-height:1.35}
.body .p{font-size:30px;font-weight:500;line-height:1.55;margin-top:10px;color:#33475f}
.ex{display:inline-block;margin-top:12px;background:#fff;border:3px solid #2d8cff;border-radius:14px;padding:8px 20px;font-size:34px;font-weight:900;color:#0b1f3a}
.foot{margin:34px 44px 0;text-align:center;font-size:30px;font-weight:700;color:#33475f;line-height:1.6}
.foot b{color:#0b1f3a}
</style></head><body><div id="card">
<div class="top"><div class="t">スマホでのZoomの入り方</div><div class="s">サッカーIQ爆上げセミナー</div></div>
<div class="step"><div class="num">1</div><div class="body"><div class="h">Zoomアプリを入れておく</div><div class="p">App Store／Google Playで「Zoom」と検索して、<br>無料のアプリを入れてください（登録は不要です）</div></div></div>
<div class="step"><div class="num">2</div><div class="body"><div class="h">LINEの参加URLをタップ</div><div class="p">自動でZoomが開きます。<br>パスコードを聞かれたら <b>808696</b> を入れてください</div></div></div>
<div class="step"><div class="num">3</div><div class="body"><div class="h">名前を「お名前（学年）」にして参加</div><div class="p">お名前を呼びながら進めます</div><div class="ex">例：鈴木（小6）</div></div></div>
<div class="foot">カメラオフ・チャットだけでも大丈夫です。<br><b>開始10分前（19:20）から入れます</b></div>
</div></body></html>
