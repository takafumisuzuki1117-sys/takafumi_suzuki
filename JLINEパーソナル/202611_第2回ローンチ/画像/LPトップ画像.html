<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#0b1f3a}
  body{width:1240px;font-family:'Noto Sans JP',sans-serif}
  #card{width:1240px;background:#0b1f3a;padding-bottom:56px}
  .hero{position:relative;width:1240px;height:760px;background:url(bg.png) center 30%/cover}
  .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,31,58,.05) 0%,rgba(11,31,58,.25) 50%,rgba(11,31,58,1) 100%)}
  .tag{position:absolute;left:56px;top:52px;background:#ffd400;color:#0b1f3a;font-weight:900;font-size:40px;padding:12px 30px;border-radius:999px}
  .closed{position:absolute;right:56px;top:58px;color:#fff;font-weight:700;font-size:30px;background:rgba(0,0,0,.5);padding:10px 22px;border-radius:12px}
  .title{position:absolute;left:0;right:0;bottom:10px;text-align:center;color:#fff}
  .lead{font-size:48px;font-weight:700;letter-spacing:.08em;text-shadow:0 3px 12px rgba(0,0,0,.7)}
  .main{font-size:132px;font-weight:900;line-height:1.05;margin-top:4px;text-shadow:0 6px 18px rgba(0,0,0,.6)}
  .main em{font-style:normal;color:#ffd400}
  .sub{text-align:center;color:#fff;font-size:46px;font-weight:700;line-height:1.55;margin-top:26px}
  .sub b{color:#ffd400}
  .band{margin:40px 56px 0;background:#fff;border-radius:22px;padding:26px 20px 24px;text-align:center;color:#0b1f3a}
  .d{font-size:52px;font-weight:900}
  .s{font-size:34px;font-weight:700;margin-top:8px;color:#33475f}
</style></head>
<body><div id="card">
  <div class="hero"><div class="shade"></div>
    <div class="tag">小5〜中3の選手と保護者へ</div>
    <div class="closed">公式LINEの方だけのご案内</div>
    <div class="title"><div class="lead">才能でも運でもない。</div>
      <div class="main">サッカーIQ<br><em>爆上げ</em>セミナー</div></div>
  </div>
  <div class="sub">Jリーガーになる選手の共通点を、<b>新学年までに。</b><br>元Jリーガーが試合映像で教えます</div>
  <div class="band"><div class="d">11/8（日）・11/13（金）・11/15（日）<br>いずれも19:30〜20:45</div>
    <div class="s">Zoomで開催｜参加無料｜3回とも同じ内容</div></div>
</div>
<script>document.title=document.getElementById('card').offsetHeight</script>
</body></html>
